name: ${PROJECT_NAME}

services:
  nevaro_frontend:
    image: nevaro_frontend
    container_name: ${PROJECT_NAME}_frontend
    build:
      context: ../frontend
    volumes:
      - ../frontend:/app/frontend
      - nevaro_frontend_node_modules:/app/frontend/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"
    command: sleep infinity
    env_file:
      - .env
  nevaro_backend:
    working_dir: /workspace/NEVARO/backend
    image: nevaro_backend
    container_name: ${PROJECT_NAME}_backend
    build:
      context: ../backend
    volumes:
      - ..:/workspace/NEVARO
    ports:
      - "${BACKEND_PORT}:8000"
    command: sleep infinity
    env_file:
      - .env
    depends_on:
      nevaro_mysql:
        condition: service_healthy


  nevaro_mysql:
    container_name: ${PROJECT_NAME}_mysql
    image: mysql:8.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - nevaro_mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      retries: 10
      start_period: 30s

  nevaro_adminer:
    image: adminer:latest
    container_name: ${PROJECT_NAME}_adminer
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=nevaro_mysql
    restart: unless-stopped
    depends_on:
      - nevaro_mysql

volumes:
  nevaro_mysql_data:
  nevaro_frontend_node_modules: