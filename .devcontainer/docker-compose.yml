name: ${PROJECT_NAME}

services:
  nevaro_frontend:
    container_name: ${PROJECT_NAME}_frontend
    build:
      context: ../frontend
    volumes:
      - ..:/workspaces/NEVARO
    ports:
      - "${FRONTEND_PORT}:5173"
    command: sleep infinity
    env_file:
      - .env
  nevaro_backend:
    container_name: ${PROJECT_NAME}_backend
    build:
      context: ../backend
    volumes:
      - ..:/workspaces/NEVARO
    ports:
      - "${BACKEND_PORT}:8000"
    command: sleep infinity
    env_file:
      - .env
    depends_on:
      nevaro_mysql:
        condition: service_healthy


  nevaro_mysql:
    container_name: ${PROJECT_NAME}_mysql
    image: mysql:8.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - nevaro_mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      retries: 10
      start_period: 30s

  nevaro_phpmyadmin:
    container_name: ${PROJECT_NAME}_phpmyadmin
    image: phpmyadmin/phpmyadmin
    env_file:
      - .env
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: ${PROJECT_NAME}_mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - nevaro_mysql

volumes:
  nevaro_mysql_data: