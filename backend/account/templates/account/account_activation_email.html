<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activate your account</title>
  </head>

  <body style="margin:0; padding:0; background:#e5e7eb; font-family: Arial, Helvetica, sans-serif;">
    <!-- Full width wrapper -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#e5e7eb; margin:0; padding:0;">
      <tr>
        <td align="center" style="padding:0 12px 40px 12px;">

          <!-- Top yellow bar -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
            <tr>
              <td style="background:#facc15; height:160px; line-height:160px; font-size:0;">&nbsp;</td>
            </tr>
          </table>

          <!-- Stack container (pull up) -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; margin-top:-96px;">
            <tr>
              <td align="center" style="padding:0;">

                <!-- Card -->
                <table role="presentation" width="420" cellpadding="0" cellspacing="0" border="0"
                  style="width:420px; max-width:100%; background:#ffffff; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.12);">
                  <tr>
                    <td style="padding:40px; text-align:center;">

                      <h1 style="margin:0 0 40px 0; font-size:24px; line-height:32px; font-weight:700; color:#111827;">
                        Welcome to Nevaro
                      </h1>

                      <p style="margin:0 0 40px 0; font-size:14px; line-height:22px; color:#6b7280;">
                        We're excited to have you get started.<br/>
                        Please confirm your E-mail to complete<br/>
                        your registration
                      </p>

                      <!-- Button -->
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                        <tr>
                          <td align="center" bgcolor="#facc15"
                            style="border-radius:9999px; box-shadow:0 6px 14px rgba(0,0,0,0.15);">
                            <a href="{{ activation_url }}"
                               style="display:inline-block; padding:10px 24px; font-size:14px; font-weight:600; color:#111827; text-decoration:none; border-radius:9999px;">
                              Confirm account
                            </a>
                          </td>
                        </tr>
                      </table>

                      <p style="margin:48px 0 10px 0; font-size:12px; line-height:18px; color:#9ca3af;">
                        If the button didn't work, click this link below
                      </p>
                    </td>
                  </tr>
                </table>

                <!-- Spacer -->
                <div style="height:24px; line-height:24px; font-size:0;">&nbsp;</div>

                <!-- Help box -->
                <table role="presentation" width="420" cellpadding="0" cellspacing="0" border="0"
                  style="width:420px; max-width:100%; background:#fef9c3; border-radius:16px;">
                  <tr>
                    <td style="padding:24px; text-align:center;">
                      <p style="margin:0 0 6px 0; font-size:14px; font-weight:600; color:#111827;">
                        Need more help?
                      </p>
                      <a href="#" style="font-size:14px; color:#2563eb; text-decoration:underline;">
                        Contact us
                      </a>
                    </td>
                  </tr>
                </table>

              </td>
            </tr>
          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
